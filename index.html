<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0e2c">
<meta name="description" content="Jeopardy Showdown: a free Bible quiz game show for youth groups. Host on a tablet, show the board on a TV, and play on any phone.">
<title>Jeopardy Showdown</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Fraunces:opsz,wght@9..144,500;9..144,700&family=Figtree:wght@400;600;800&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="questions.js"></script>
<style>
html{{-webkit-text-size-adjust:100%}}
body{{margin:0;padding-top:max(16px,env(safe-area-inset-top,0px))}}
img{{max-width:100%}}
[hidden]{{display:none!important}}

/* Layout: a game-show stage. Deep ink background, a cobalt board with gold point values,
   clues set large in a book serif like a page of scripture. Single dark look on purpose. */
:root{
  --stage:#0b0e2c; --stage2:#121640; --panel:#181d52; --tile:#2032a8; --tile-hi:#2b40c9;
  --gold:#f3c34d; --gold-ink:#2a1d00; --text:#f3f1ff; --muted:#a9addb; --line:rgba(214,218,255,.16);
  --good:#3fd394; --bad:#ff7272; --white:#ffffff;
  --f-display:"Anton","Impact","Arial Narrow",sans-serif;
  --f-clue:"Fraunces","Georgia","Times New Roman",serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{min-height:100%}
body{background:radial-gradient(1200px 600px at 50% -10%,#1b2170 0%,var(--stage) 60%) fixed,var(--stage);color:var(--text);font-family:var(--f-body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
.wrap{max-width:1100px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h2{font-size:20px}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;border-radius:10px;padding:10px 14px;background:var(--panel);border:1px solid var(--line);font-weight:600}
button:hover:not(:disabled){border-color:rgba(214,218,255,.45)}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button:disabled{opacity:.45;cursor:not-allowed}
.btn-gold{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:800}
.btn-good{background:var(--good);color:#04261a;border-color:var(--good);font-weight:800}
.btn-bad{background:var(--bad);color:#3a0606;border-color:var(--bad);font-weight:800}
.btn-ghost{background:transparent}
.btn-sm{padding:6px 10px;font-size:13px;border-radius:8px}
.on{outline:3px solid var(--gold);outline-offset:1px}
input,textarea,select{background:var(--stage);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{resize:vertical;min-height:58px}
label,.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:700}
.muted{color:var(--muted)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.col{display:flex;flex-direction:column;gap:10px}
.spacer{flex:1}
.brand{font-family:var(--f-display);font-size:clamp(34px,7vw,64px);letter-spacing:.02em;line-height:1;color:var(--gold);text-transform:uppercase}
.brand small{display:block;font-family:var(--f-body);font-size:14px;letter-spacing:.18em;color:var(--muted);margin-top:8px;font-weight:600}
.eyebrow{font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--muted);font-weight:700}
.card{background:var(--stage2);border:1px solid var(--line);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:12px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.role{text-align:left;padding:22px;border-radius:16px;background:var(--panel);display:flex;flex-direction:column;gap:6px}
.role b{font-family:var(--f-display);font-size:30px;letter-spacing:.02em;font-weight:400;color:var(--gold)}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:99px;background:var(--panel);border:1px solid var(--line);max-width:100%;overflow-wrap:anywhere}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.live{background:var(--good)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border-radius:99px;padding:8px 14px;font-size:14px}
.chip.sel{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:800}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:10px;overflow:hidden;flex-wrap:wrap}
.seg button{border:0;border-radius:0;background:transparent}
.seg button.sel{background:var(--gold);color:var(--gold-ink);font-weight:800}
.opt{display:flex;flex-direction:column;gap:6px}
.toggle{display:flex;gap:10px;align-items:center;text-transform:none;letter-spacing:0;font-size:15px;color:var(--text);font-weight:600}
.toggle input{width:20px;height:20px;accent-color:var(--gold)}
/* scoreboard */
.scores{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px}
.team{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:4px;min-width:0}
.team .nm{font-weight:800;overflow-wrap:anywhere}
.team .sc{font-family:var(--f-display);font-size:30px;color:var(--gold);font-variant-numeric:tabular-nums;line-height:1.1}
.team .sc.neg{color:var(--bad)}
.team.turn{border:2px solid var(--gold);box-shadow:0 0 0 4px rgba(243,195,77,.15)}
.team .mem{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.badge{align-self:flex-start;font-size:11px;letter-spacing:.08em;text-transform:uppercase;background:var(--gold);color:var(--gold-ink);border-radius:6px;padding:2px 6px;font-weight:800}
/* board */
.board{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px;background:#05071c;padding:6px;border-radius:14px}
.cat{background:var(--tile);border-radius:6px;min-height:64px;display:flex;align-items:center;justify-content:center;text-align:center;padding:6px;font-family:var(--f-display);text-transform:uppercase;letter-spacing:.02em;font-size:clamp(11px,1.8vw,20px);line-height:1.1;overflow-wrap:anywhere}
.tile{background:var(--tile);border:0;border-radius:6px;aspect-ratio:16/10;max-width:100%;font-family:var(--f-display);font-size:clamp(18px,4.4vw,46px);color:var(--gold);font-weight:400;padding:0;text-shadow:0 2px 0 rgba(0,0,0,.45);font-variant-numeric:tabular-nums}
.tile:hover:not(:disabled){background:var(--tile-hi)}
.tile:disabled{background:#141c62;opacity:1;cursor:default;color:transparent;text-shadow:none}
.turnbar{background:var(--panel);border:1px solid var(--gold);border-radius:12px;padding:10px 14px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.turnbar b{font-family:var(--f-display);font-weight:400;font-size:22px;color:var(--gold);letter-spacing:.02em;text-transform:uppercase}
/* overlay */
.overlay{position:fixed;inset:0;background:rgba(5,7,26,.95);z-index:20;overflow:auto;
  padding:calc(16px + env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.ov-in{max-width:1000px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.cluebox{background:var(--tile);border-radius:18px;padding:clamp(20px,4vw,44px);min-height:200px;display:flex;flex-direction:column;justify-content:center;gap:12px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.clue{font-family:var(--f-clue);font-weight:500;font-size:clamp(22px,3.6vw,42px);line-height:1.25;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.hint{font-family:var(--f-clue);font-size:clamp(16px,2.2vw,22px);text-align:center;color:var(--gold)}
.dd{font-family:var(--f-display);color:var(--gold);font-size:clamp(40px,9vw,96px);text-align:center;line-height:1;text-transform:uppercase;overflow-wrap:anywhere}
.answer{border:2px dashed var(--gold);border-radius:14px;padding:12px 14px;display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.answer .a{font-family:var(--f-clue);font-weight:700;font-size:22px;flex:1;min-width:0;overflow-wrap:anywhere}
.answer.revealed{border-style:solid;background:rgba(243,195,77,.1)}
.timer{height:12px;border-radius:99px;background:var(--panel);overflow:hidden;flex:1;min-width:120px}
.timer i{display:block;height:100%;width:0;background:var(--gold);transition:width .2s linear}
.timer i.low{background:var(--bad)}
.ttext{font-family:var(--f-display);font-size:26px;width:56px;text-align:right;font-variant-numeric:tabular-nums}
.queue{display:flex;flex-direction:column;gap:6px;margin:0;padding:0;list-style:none}
.queue li{background:var(--panel);border-radius:10px;padding:8px 12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.queue li.first{background:var(--gold);color:var(--gold-ink);font-weight:800}
.ok{color:var(--good);font-weight:800}.no{color:var(--bad);font-weight:800}
.scorerow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--panel);border-radius:12px;padding:8px 10px}
.scorerow .nm{flex:1;min-width:110px;font-weight:700;overflow-wrap:anywhere}
.on-good{outline:3px solid var(--white);outline-offset:1px}
.answering{font-family:var(--f-display);font-size:clamp(22px,4vw,34px);font-weight:400;color:var(--gold);text-transform:uppercase;letter-spacing:.02em}
/* lobby */
.code{font-family:var(--f-display);font-size:clamp(56px,14vw,120px);letter-spacing:.12em;color:var(--gold);line-height:1}
.qr{background:var(--white);padding:12px;border-radius:12px;width:max-content;max-width:100%}
.qr img,.qr canvas{display:block;width:200px;height:200px;max-width:100%}
.lobby{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:center}
@media (max-width:700px){.lobby{grid-template-columns:minmax(0,1fr)}}
.spot{display:flex;flex-direction:column;gap:6px;text-align:left;padding:14px;border-radius:14px;background:var(--panel)}
.spot.mine{border:2px solid var(--gold)}
.spot h3{font-family:var(--f-display);font-weight:400;font-size:24px;letter-spacing:.02em;text-transform:uppercase;color:var(--gold);overflow-wrap:anywhere}
/* player */
.buzz{width:min(74vw,300px);aspect-ratio:1;border-radius:50%;margin:8px auto;display:block;background:radial-gradient(circle at 35% 30%,#ff9b8a,#e2382b 60%,#a51d14);border:6px solid #ffd6cf;color:var(--white);font-family:var(--f-display);font-size:56px;letter-spacing:.04em;box-shadow:0 14px 0 #6e120c,0 24px 40px rgba(0,0,0,.5)}
.buzz:active:not(:disabled){transform:translateY(8px);box-shadow:0 6px 0 #6e120c}
.buzz:disabled{filter:grayscale(.85) brightness(.6)}
.status{text-align:center;font-size:17px}
.big-status{text-align:center;font-family:var(--f-display);font-size:clamp(26px,7vw,44px);color:var(--gold);text-transform:uppercase;line-height:1.1;overflow-wrap:anywhere}
.codeinput{font-family:var(--f-display);font-size:40px;letter-spacing:.3em;text-align:center;text-transform:uppercase}
/* editor */
.ed-clue{display:grid;grid-template-columns:52px minmax(0,1.4fr) minmax(0,1fr);gap:8px;align-items:start}
.ed-clue .v{font-family:var(--f-display);color:var(--gold);font-size:22px;padding-top:6px}
.ed-clue .sub{grid-column:2 / 4;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
@media (max-width:640px){.ed-clue{grid-template-columns:44px minmax(0,1fr)}.ed-clue .ans,.ed-clue .sub{grid-column:2}.ed-clue .sub{grid-template-columns:minmax(0,1fr)}}
.confirm{background:rgba(255,114,114,.12);border:1px solid var(--bad);border-radius:12px;padding:12px}
.note{font-size:13px;color:var(--muted)}
.banner{font-family:var(--f-display);font-size:clamp(36px,8vw,80px);color:var(--gold);text-align:center;line-height:1.05;text-transform:uppercase;overflow-wrap:anywhere}
.catpick{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:8px}
.catpick button{text-align:left}
.catpick button.sel{background:var(--gold);color:var(--gold-ink);border-color:var(--gold);font-weight:800}
/* TV board display */
body.tv .wrap{max-width:1600px}
.tvclue{font-family:var(--f-clue);font-weight:500;font-size:clamp(28px,4.6vw,64px);line-height:1.2;text-align:center;text-wrap:balance;overflow-wrap:anywhere}
.tvbox{background:var(--tile);border-radius:22px;padding:clamp(24px,5vw,64px);min-height:48vh;display:flex;flex-direction:column;justify-content:center;gap:18px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.result{font-family:var(--f-display);text-transform:uppercase;text-align:center;font-size:clamp(30px,6vw,72px);line-height:1}
.result.ok{color:var(--good)}.result.no{color:var(--bad)}
.tvcode{font-family:var(--f-display);font-size:clamp(80px,16vw,200px);letter-spacing:.12em;color:var(--gold);line-height:1}
body.tv .qr img,body.tv .qr canvas{width:260px;height:260px}
.blank{display:inline-block;min-width:4.5ch;border-bottom:4px solid currentColor;margin:0 .15em;vertical-align:baseline;height:1em}
.cliptag{display:inline-flex;gap:6px;align-items:center;justify-content:center;font-weight:800;color:var(--gold);letter-spacing:.06em;text-transform:uppercase;font-size:13px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<script>
const VALUES=[100,200,300,400,500];
/* ---------- question bank: edit questions.js to add categories and questions ---------- */
const QB=window.QUESTION_BANK||{categories:[],finals:[]};
/* accepts a Spotify share link, a spotify:track: URI, or a bare track ID */
const spotifyId=v=>{const m=/(?:track[\/:])([A-Za-z0-9]{22})/.exec(String(v||''))||/^([A-Za-z0-9]{22})$/.exec(String(v||'').trim());return m?m[1]:''};
const media=q=>(q.audio||q.melody||spotifyId(q.spotify))?{spotify:spotifyId(q.spotify),audio:q.audio?String(q.audio):'',start:+q.start||0,length:Math.min(20,Math.max(2,+q.length||8)),melody:q.melody?String(q.melody):'',bpm:+q.bpm||100}:null;
const acc=x=>(Array.isArray(x)?x:String(x||'').split('|')).map(v=>String(v).trim()).filter(Boolean).join('|');
const BANK=(QB.categories||[]).filter(c=>c&&c.name&&Array.isArray(c.questions)).map((c,i)=>({id:String(c.name).toLowerCase().replace(/[^a-z0-9]+/g,'-')+'-'+i,name:String(c.name),
  q:c.questions.filter(q=>q&&q.question&&q.answer&&!('spotify' in q&&!spotifyId(q.spotify))).map(q=>[Math.min(7,Math.max(1,parseInt(q.level,10)||3)),String(q.question),String(q.answer),String(q.hint||''),acc(q.accept),media(q)])})).filter(c=>c.q.length);
const FINALS=(QB.finals||[]).filter(f=>f&&f.question&&f.answer).map(f=>[String(f.category||'Final Round'),String(f.question),String(f.answer),String(f.hint||''),acc(f.accept)]);
if(!FINALS.length)FINALS.push(['The Disciples','Before following Jesus, this disciple was a tax collector. The first Gospel carries his name.','Matthew','He was also called Levi.','matthew|levi']);
/* Spotify categories built from your playlists (questions.js: spotify). Links are matched by playlist position. */
const toSec=v=>{if(v==null||v==='')return null;if(typeof v==='number')return v;const m=/(\d+):(\d{1,2})/.exec(String(v));return m?(+m[1])*60+(+m[2]):(/^\s*\d+(\.\d+)?\s*$/.test(String(v))?+v:null)};
const linkList=t=>String(t||'').match(/(?:open\.spotify\.com\/(?:intl-[a-z]+\/)?track\/|spotify:track:)[A-Za-z0-9]{22}/g)?.map(spotifyId)||[];
(()=>{const sp=QB.spotify;if(!sp)return;const wl=linkList(sp.worshipLinks),hl=linkList(sp.hymnLinks);
  const idFor=(e,list)=>spotifyId(e.link)||(e.n>0?list[e.n-1]||'':'');
  const acc2=e=>[...(e.accept||[]),String(e.title||'').toLowerCase().replace(/\s*[\(\[].*$/,'')].filter(Boolean).join('|');
  const guess=(key,list,name,question)=>{const q=(sp[key]||[]).map(e=>{const id=idFor(e,list);if(!id||!e.title)return null;
      return[Math.min(7,Math.max(1,+e.level||3)),question,String(e.title),e.artist?`Recorded by ${e.artist}.`:'',acc2(e),{spotify:id,audio:'',start:toSec(e.start)??45,length:8,melody:'',bpm:100}]}).filter(Boolean);
    if(q.length>=5)BANK.push({id:'spotify-'+key,name,clipByRow:true,q})};
  guess('worship',wl,'Guess the Worship Song','Listen to the clip. Name this worship song.');
  guess('hymns',hl,'Guess the Hymn','Listen to the recording. Name this hymn.');
  const lq=(sp.lyrics||[]).map(e=>{const id=idFor(e,hl),st=toSec(e.start),cut=toSec(e.cut);if(!id||st==null||cut==null||cut<=st||!e.lyric||!e.answer)return null;
    return[Math.min(7,Math.max(1,+e.level||3)),String(e.lyric),String(e.answer),'',(e.accept||[]).join('|'),{spotify:id,audio:'',start:st,length:Math.min(20,cut-st),melody:'',bpm:100}]}).filter(Boolean);
  if(lq.length>=5)BANK.push({id:'spotify-lyrics',name:'Finish the Hymn',q:lq});
})();
const CLIP_SECONDS=[12,10,8,5,3];
const PRESETS=[{id:'random',name:'Random categories'},{id:'pick',name:'Pick my own categories'}];

/* ---------- helpers ---------- */
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const $=s=>document.querySelector(s);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const mkClue=x=>Object.assign({q:x[1],a:x[2],h:x[3]||'',alt:x[4]||''},x[5]?{m:x[5]}:{});
/* lyric blanks: ___ shows as an underlined gap */
const clueText=q=>esc(q).replace(/_{3,}/g,'<span class="blank" aria-label="blank"></span>');
const short=(s,n)=>String(s??'').trim().slice(0,n);
const uid=()=>Math.random().toString(36).slice(2,10);
function newCode(){const L='ABCDEFGHJKLMNPQRSTUVWXYZ';let s='';for(let i=0;i<4;i++)s+=L[Math.floor(Math.random()*L.length)];return s}
const BASE=location.href.split('#')[0];
const joinLink=code=>BASE+'#'+code;
const PREFIX='scripture-showdown-v1-';
/* difficulty modes: which question level goes on each row (100 to 500) */
const LEVELS={all:[1,2,3,4,5],inter:[2,3,4,5,6],expert:[4,5,6,6,7]};
const LEVEL_NAMES={all:'All levels',inter:'Intermediate',expert:'Expert'};
/* random categories, preferring ones with enough questions at the levels this mode needs */
function exactRows(b,lv){const used=new Set();let n=0;lv.forEach(d=>{const k=b.q.findIndex((q,i)=>!used.has(i)&&q[0]===d);if(k>=0){used.add(k);n++}});return n}
function randomCats(mode){const lv=LEVELS[mode]||LEVELS.all;
  for(const need of [5,4,3]){const ok=BANK.filter(b=>exactRows(b,lv)>=need);if(ok.length>=5)return shuffle(ok.map(b=>b.id)).slice(0,5)}
  return shuffle(BANK.map(b=>b.id)).slice(0,5)}
function buildBoard(catIds,mode){const lv=LEVELS[mode]||LEVELS.all;
  return{title:'Jeopardy Showdown',levels:lv,cats:catIds.map(id=>{const b=BANK.find(x=>x.id===id);return{name:b.name,bank:id,clues:pickClues(b,lv)}}),
    final:(f=>({cat:f[0],q:f[1],a:f[2],h:f[3],alt:f[4]}))(rnd(FINALS))};
}
function pickClues(b,lv){if(b.clipByRow)return pickClues({q:b.q},lv).map((c,r)=>{c.m=Object.assign({},c.m,{length:CLIP_SECONDS[r]});c.song=true;return c});const used=new Set();return (lv||LEVELS.all).map(d=>{let best=null;
  for(let dist=0;dist<7&&!best;dist++){for(const lvl of (d>=4?[d+dist,d-dist]:[d-dist,d+dist])){const pool=b.q.filter((q,k)=>!used.has(k)&&q[0]===lvl);if(pool.length){best=rnd(pool);break}}}
  if(!best)best=rnd(b.q);used.add(b.q.indexOf(best));return mkClue(best)})}
const norm=s=>String(s||'').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/\([^)]*\)/g,' ').replace(/&/g,' and ').replace(/[^a-z0-9 ]+/g,' ')

    case 'random':{const open=openTeams().filter(i=>S.teams[i].id!==me.team);if(!open.length)return;const min=Math.min(...open.map(i=>members(i).length));me.team=S.teams[rnd(open.filter(i=>members(i).length===min))].id;break}

    case 'solo':{if(S.phase!=='lobby'||(myT!=null&&members(myT).length===1))return;soloTeam(pid);break}
    case 'rename':{if(S.phase!=='lobby'||!me.team)return;renameTeam(me.team,m.name);break}
    case 'leave':me.team=null;break;
    case 'pick':{if(S.phase!=='board'||myT!==S.turn)return;const c=+m.c,r=+m.r;if(!(c>=0&&c<5&&r>=0&&r<5)||S.used[c][r])return;openTile(c,r);return}
    case 'buzz':{if(S.phase!=='clue'||S.settings.mode!=='buzz'||!S.buzzOpen||m.e!==S.epoch||myT==null||S.tried.includes(myT)||S.answering!=null)return;
      if(!S.inbox.buzz.includes(pid))S.inbox.buzz.push(pid);
      if(S.answering==null){S.answering=myT;S.buzzOpen=false;resetTimer(S.settings.autoTimer);full=true}break}
    case 'ans':{if(S.phase!=='clue'||m.e!==S.epoch||myT==null||myT!==S.answering||S.revealed)return;if(S.inbox.ans[pid])return;S.inbox.ans[pid]={t:short(m.text,80),t0:Date.now()};if(autoJudge())full=true;break}
    case 'wager':{if(S.phase!=='final-cat'||m.e!==S.epoch||myT==null)return;S.inbox.wag[pid]={v:short(m.v,7),t0:Date.now()};break}
    case 'fans':{if(S.phase!=='final-clue'||m.e!==S.epoch||myT==null)return;S.inbox.fans[pid]={t:short(m.text,80),t0:Date.now()};break}
    default:return;
  }
  if(full){commit()}else netChanged();
}

/* ---------- host: game logic ---------- */
function createGame(){
  let g;
  if(setup.source==='custom'){const c=custom.find(x=>x.id===setup.customId);if(!c)return;g=clone(c)}
  else{let ids;const pr=PRESETS.find(p=>p.id===setup.preset);
    if(setup.preset==='pick')ids=setup.pick.slice(0,5);else if(pr&&pr.cats)ids=pr.cats;else ids=randomCats(setup.settings.level);
    if(ids.length<5)return;g=buildBoard(ids,setup.settings.level);if(pr&&pr.cats)g.title=pr.name}
  const dds=[];while(dds.length<setup.settings.dd){const c=Math.floor(Math.random()*5),r=1+Math.floor(Math.random()*4);if(!dds.some(d=>d[0]===c&&d[1]===r))dds.push([c,r])}
  const keep=S&&S.phase==='lobby'?S:null;
  S={code:keep?.code||newCode(),game:g,settings:clone(setup.settings),teams:keep?.teams||[],members:keep?.members||{},phase:'lobby',used:[0,1,2,3,4].map(()=>[0,0,0,0,0]),dds,
     cur:null,turn:0,answering:null,tried:[],revealed:false,hint:false,epoch:1,buzzOpen:false,tmr:{len:setup.settings.timer*1000,left:setup.settings.timer*1000,run:false,end:0},
     scored:{},judged:{},ddWager:'',ddTeam:null,final:{wagers:{},marks:{}},inbox:{buzz:[],ans:{},wag:{},fans:{}},tv:false,sound:S?.sound!==false};
  saveHost();return !keep;
}
const curClue=()=>S.cur?S.game.cats[S.cur.c].clues[S.cur.r]:null;
const isDD=()=>!!(S.cur&&S.dds.some(d=>d[0]===S.cur.c&&d[1]===S.cur.r));
function clueValue(){if(isDD())return parseInt(S.ddWager,10)||0;const v=VALUES[S.cur.r];return S.hint&&S.settings.hintHalf?Math.round(v/2):v}
function resetTimer(run){const len=S.settings.timer*1000;S.tmr={len,left:len,run:!!run,end:run?Date.now()+len:0};S.timeUp=false}
function tLeft(){return S.tmr.run?Math.max(0,S.tmr.end-Date.now()):S.tmr.left}
function newEpoch(){S.epoch++;S.inbox={buzz:[],ans:{},wag:{},fans:{}};S.judged={}}
const titleCache=store.get('ssw.titles',{});
async function songTitle(id){if(titleCache[id])return titleCache[id];
  try{const r=await fetch('https://open.spotify.com/oembed?url='+encodeURIComponent('https://open.spotify.com/track/'+id));if(!r.ok)return '';const j=await r.json();const t=String(j.title||'').trim();
    if(t){titleCache[id]=t;store.set('ssw.titles',titleCache)}return t}catch{return ''}}
function fillSongTitles(){if(!S)return;S.game.cats.forEach(cat=>cat.clues.forEach(cl=>{if(cl.song&&cl.m&&cl.m.spotify&&!cl.a){songTitle(cl.m.spotify).then(t=>{if(t&&S&&!cl.a){cl.a=t;cl.alt=t.toLowerCase().replace(/\s*[\(\[-].*$/,'')+'|'+t.toLowerCase();commit()}})}}))}
function openTile(c,r){
  if(S.used[c][r])return;
  S.cur={c,r};S.revealed=false;S.hint=false;peek=false;newEpoch();S.scored={};S.tried=[];S.ddWager='';
  const hasT=S.teams.length>0;if(S.turn>=S.teams.length)S.turn=0;S.answering=S.settings.mode==='turns'&&hasT?S.turn:null;S.ddTeam=hasT?S.turn:null;
  if(isDD()){S.phase='dd';S.buzzOpen=false;resetTimer(false);}
  else{S.phase='clue';S.buzzOpen=S.settings.mode==='buzz';resetTimer(S.settings.autoTimer);if(curClue().m)clipCmd('play')}
  S.passes=0;commit();
}
function closeTile(){if(S.cur&&curClue()?.m)clipCmd('stop');if(S.cur)S.used[S.cur.c][S.cur.r]=1;S.cur=null;S.phase='board';S.buzzOpen=false;S.tmr.run=false;S.turn=S.teams.length?(S.turn+1)%S.teams.length:0;commit()}
function scoreTeam(i,sign,val,book){const prev=book[i]||0;S.teams[i].score-=prev*val;if(prev===sign){delete book[i]}else{S.teams[i].score+=sign*val;book[i]=sign}}
function markClue(i,sign){
  const val=clueValue(),prev=S.scored[i]||0,free=!S.settings.wrongLose&&!isDD();
  if(sign===-1&&free){if(prev===1)S.teams[i].score-=val;if(prev===-1)delete S.scored[i];else{S.scored[i]=-1;fire('no')}return}
  if(prev===-1&&free)delete S.scored[i];
  scoreTeam(i,sign,val,S.scored);
  if(S.scored[i]===sign)fire(sign===1?'ok':'no');
  if(sign===1&&S.scored[i]===1){S.tmr.left=tLeft();S.tmr.run=false;S.revealed=true;S.buzzOpen=false;}
}
function passTo(t){
  if(S.answering!=null&&!S.tried.includes(S.answering))S.tried.push(S.answering);
  S.passes=(S.passes||0)+1;newEpoch();
  if(t==null){S.answering=null;S.buzzOpen=true}else S.answering=t;
  resetTimer(S.settings.autoTimer);
}
function nextTeam(){
  if(S.answering!=null&&!S.tried.includes(S.answering))S.tried.push(S.answering);
  newEpoch();
  if(S.settings.mode==='turns'){const n=S.teams.length;let nx=null;for(let k=1;k<=n;k++){const t=((S.answering??S.turn)+k)%n;if(!S.tried.includes(t)){nx=t;break}}S.answering=nx}
  else{S.answering=null;S.buzzOpen=true}
  resetTimer((S.answering!=null||S.settings.mode==='buzz')&&S.settings.autoTimer);
}
function inboxList(key){return Object.entries(S.inbox[key]||{}).map(([pid,v])=>({pid,name:S.members[pid]?.name||'Player',team:pTeam(pid),...v})).filter(x=>x.team!=null).sort((a,b)=>a.t0-b.t0)}
function autoJudge(){
  if(S.phase!=='clue'||S.settings.answers!=='typed'||S.revealed||S.answering==null)return false;
  const t=S.answering;if(S.judged[t])return false;
  const first=inboxList('ans').find(x=>x.team===t);if(!first)return false;
  const ok=judge(first.t,curClue());S.judged[t]=ok?1:-1;
  if(!S.settings.auto)return true;
  S.tmr.left=tLeft();S.tmr.run=false;
  if(ok)markClue(t,1);else{markClue(t,-1);}
  return true;
}
function commit(){pruneTeams();syncNames();saveHost();broadcast();render();hostAudio();hostClip()}
function publicState(){
  const g=S.game,ph=S.phase,cl=curClue(),on=new Set(onlinePids());
  const st={ph,code:S.code,title:short(g.title,60),cats:g.cats.map(x=>short(x.name,40)),used:S.used,
    teams:S.teams.map((t,i)=>({id:t.id,name:t.name,named:t.custom!==false,need:needName(i),score:t.score,m:members(i).map(m=>({p:m.pid,n:m.name,on:on.has(m.pid)}))})),
    loose:Object.entries(S.members).filter(([,m])=>!m.team||teamIdx(m.team)<0).map(([p,m])=>({p,n:m.name})),
    cap:S.settings.cap,create:S.settings.playersCreate,mode:S.settings.mode,ans:S.settings.answers,turn:S.turn,epoch:S.epoch,open:!!S.buzzOpen,
    tm:{left:tLeft(),run:!!S.tmr.run,len:S.tmr.len},music:!!S.music,tmusic:S.tmusic!==false,fx:S.fx||null,clip:S.clip||null,hi:activeTeam()};
  if(S.cur&&cl){st.clue={cat:g.cats[S.cur.c].name,val:clueValue(),dd:isDD(),
    q:ph==='clue'?cl.q:null,h:S.hint&&ph==='clue'?cl.h:null,a:S.revealed?(cl.a||(cl.song?'':null)):null,rev:!!S.revealed,m:ph==='clue'&&cl.m?cl.m:null,
    who:S.answering,tried:S.tried,res:S.scored,queue:S.inbox.buzz.slice(0,6).map(p=>S.members[p]?.name||'Player')}}
  if(ph.startsWith('final')||ph==='over')st.fin={cat:g.final.cat,q:ph!=='final-cat'?g.final.q:null,h:S.hint&&ph==='final-clue'?g.final.h:null,a:(ph==='final-reveal'||ph==='over')?g.final.a:null,res:S.final.marks};
  return st;
}

    if(S.tmr.run&&left===0&&!S.timeUp){S.timeUp=true;S.tmr.run=false;S.tmr.left=0;commit()}}

  const k=JSON.stringify(Object.assign({},st,{tm:{run:st.tm?.run,left:st.tm?.run?0:st.tm?.left}}));

function activeTeam(){if(!S||S.phase==='lobby')return -1;if((S.phase==='clue'||S.phase==='dd')&&S.answering!=null)return S.answering;return S.turn}

function boardHTML(cats,used,host){const act=host===true?'tile':host||'';

function playersHTML(){

function timerHTML(){
  const left=tLeft(),run=S.tmr.run;
  return `<div class="row"><div class="timer"><i id="tbar" class="${left<=5000?'low':''}" style="width:${100*left/(S.tmr.len||1)}%"></i></div><span class="ttext" id="ttext">${Math.ceil(left/1000)}s</span></div>
  <div class="row">${run?'<button class="btn-sm" data-act="t-pause">Pause timer</button>':left>0&&left<S.tmr.len?'<button class="btn-sm btn-gold" data-act="t-resume">Resume timer</button>':'<button class="btn-sm btn-gold" data-act="t-start">Start timer</button>'}<button class="btn-sm" data-act="t-reset">Reset</button>${S.timeUp&&!run?'<span class="no">Time’s up</span>':''}</div>`;
}
const songCard=(id,h)=>`<div style="border-radius:12px;overflow:hidden;max-width:100%"><iframe title="Spotify song" src="https://open.spotify.com/embed/track/${esc(id)}?utm_source=generator" width="100%" height="${h||80}" frameborder="0" allow="encrypted-media" loading="lazy" style="display:block;border:0"></iframe></div>`;
function answerBox(a){
  const show=S.revealed||!S.tv||peek;
  return `<div class="answer ${S.revealed?'revealed':''}"><span class="eyebrow">${S.revealed?'Answer (everyone can see it)':'Answer · host only'}</span><span class="a">${show?esc(a):'Hidden'}</span>
  ${!S.revealed&&S.tv?`<button class="btn-sm" data-act="peek">${peek?'Hide':'Peek'}</button>`:''}${!S.revealed?'<button class="btn-sm btn-gold" data-act="reveal">Reveal answer</button>':''}</div>`;
}
function hintRow(h){
  if(!h)return '';

  return `<div class="row"><span class="note" style="flex:1;min-width:0">Hint: ${!S.tv||peek?esc(h):'hidden'}</span><button class="btn-sm" data-act="hint">Give hint${S.settings.hintHalf&&!isDD()?' (half points)':''}</button></div>`;

function answersHTML(){
  if(S.settings.answers!=='typed')return '';

  const cl=curClue();
  return `<ol class="queue">${list.map(x=>{const ok=judge(x.t,cl);return `<li><span><b>${esc(x.name)}</b> <span class="muted">${esc(S.teams[x.team].name)}</span></span><span class="spacer"></span><span>${S.tv&&!S.revealed&&!peek?'(hidden)':esc(x.t)}</span><span class="${ok?'ok':'no'}">${ok?'✓ match':'✗ no match'}</span></li>`}).join('')}</ol>`;
}
function queueHTML(){

  return `<ol class="queue">${q.map((p,i)=>`<li class="${i===0?'first':''}"><b>${i+1}</b><span>${esc(S.members[p]?.name||'Player')}</span><span class="spacer"></span><span>${esc(S.teams[pTeam(p)]?.name||'')}</span></li>`).join('')}</ol>`;

function clueOverlay(){
  const g=S.game,c=S.cur,cl=curClue(),dd=isDD();

    const t=S.ddTeam,max=Math.max(500,t!=null?S.teams[t].score:0);
    return `<div class="overlay" role="dialog" aria-label="Daily Double"><div class="ov-in">

      <div class="row">${S.teams.map((tm,i)=>`<button class="${t===i?'btn-gold':''}" data-act="dd-team" data-i="${i}">${esc(tm.name)}</button>`).join('')}</div>
      ${t!=null?`<label for="ddw">Wager (5 to ${max})</label><input id="ddw" type="number" inputmode="numeric" min="5" max="${max}" value="${esc(S.ddWager)}" data-bind="ddWager">`:''}

    <div class="cluebox">${cl.m?'<div class="cliptag">♪ Audio clip</div>':''}<div class="clue">${clueText(cl.q)}</div>${S.hint&&cl.h?`<div class="hint">Hint: ${esc(cl.h)}</div>`:''}</div>
    ${cl.m?`<div class="row"><span class="note" style="flex:1;min-width:0">♪ This clue has ${cl.m.spotify?'a Spotify clip':'an audio clip'}. It plays ${displayOn()?'on the TV board':'on this device'} when the clue opens.${cl.m.spotify?' If it doesn’t start, tap Play clip again. The TV board’s browser should be logged into Spotify for full songs.':''}</span><button class="btn-sm btn-gold" data-act="clip-play">Play clip again</button><button class="btn-sm" data-act="clip-stop">Stop</button></div>`:''}
    ${hintRow(cl.h)}

    ${timerHTML()}
    <div class="card" style="gap:10px">
      ${ans!=null?`<span class="eyebrow">Answering now</span><span class="answering">${esc(S.teams[ans].name)}</span>
        <div class="row"><button class="btn-good ${S.scored[ans]===1?'on-good':''}" data-act="mark" data-i="${ans}" data-s="1">Correct +${val}</button>
        <button class="btn-bad ${S.scored[ans]===-1?'on-good':''}" data-act="mark" data-i="${ans}" data-s="-1">Wrong${S.settings.wrongLose||dd?' −'+val:''}</button>
</div>
        ${!dd&&!S.revealed&&!(S.passes>0)&&left.length?(mode==='turns'?`<span class="eyebrow">Pass this question to (one pass per question)</span><div class="row">${left.map(i=>`<button class="btn-sm" data-act="pass" data-i="${i}">${esc(S.teams[i].name)}</button>`).join('')}</div>`:'<div class="row"><button data-act="pass" data-i="-1">Reopen buzzers for other teams (one time)</button></div>'):''}
        ${S.passes>0&&!S.revealed&&!dd?'<span class="note">This question has already been passed once.</span>':''}
        ${S.judged[ans]?`<span class="${S.judged[ans]===1?'ok':'no'}">${S.settings.auto?'Auto-scored':'Typed answer looks'} ${S.judged[ans]===1?'correct':'wrong'}${S.settings.auto?'. Tap a button to change it.':''}</span>`:''}`
      :mode==='buzz'?`<span class="eyebrow">Buzz order</span><div id="buzzq">${queueHTML()}</div><div class="row">${S.buzzOpen?'<button class="btn-sm" data-act="buzz-close">Close buzzers</button>':'<button class="btn-sm" data-act="buzz-open">Open buzzers</button>'}<button class="btn-sm" data-act="buzz-reset">Clear buzzes</button></div>
        <span class="note">No phones? Tap the team that answers first:</span><div class="row">${S.teams.map((t,i)=>S.tried.includes(i)?'':`<button class="btn-sm" data-act="set-ans" data-i="${i}">${esc(t.name)}</button>`).join('')}</div>`
      :`<span class="note">${S.teams.length?'Every team has tried. Reveal the answer and head back to the board.':'No teams yet. You can still reveal the answer, and players can join any time with the game code.'}</span>`}
      ${S.tried.length?`<span class="note">Already tried: ${esc(S.tried.map(i=>S.teams[i].name).join(', '))}</span>`:''}
    </div>
    ${S.settings.answers==='typed'?`<div class="card" style="gap:8px"><div class="eyebrow">Typed answers</div><div id="answers">${answersHTML()}</div></div>`:''}
    <details class="card"><summary class="eyebrow" style="cursor:pointer">Give or take points from any team</summary>
      ${S.teams.map((t,i)=>`<div class="scorerow"><span class="nm">${esc(t.name)} <span class="muted">${t.score}</span></span><button class="btn-sm btn-good" data-act="adj" data-i="${i}" data-v="${val}">+${val}</button><button class="btn-sm btn-bad" data-act="adj" data-i="${i}" data-v="${-val}">−${val}</button></div>`).join('')}</details>
  </div></div>`;
}

    ${rev?`<div class="answer revealed"><span class="eyebrow">Answer</span><span class="a">${esc(f.a)}</span></div>`:`<div class="answer"><span class="eyebrow">Answer · host only</span><span class="a">${!S.tv||peek?esc(f.a):'Hidden'}</span>${S.tv?`<button class="btn-sm" data-act="peek">${peek?'Hide':'Peek'}</button>`:''}<button class="btn-sm btn-gold" data-act="final-reveal">Reveal answer</button></div>`}
    ${!rev?timerHTML():''}
    <div class="card" id="fextra">${finalExtraHTML()}</div>
    ${rev?`<div class="col"><div class="eyebrow">Mark each team (tap again to undo)</div>${S.teams.map((t,i)=>{const w=parseInt(S.final.wagers[i],10)||0;return `<div class="scorerow"><span class="nm">${esc(t.name)} <span class="muted">${t.score} · wagered ${w}</span></span>
      <button class="btn-good ${S.final.marks[i]===1?'on-good':''}" data-act="fmark" data-i="${i}" data-s="1">Correct +${w}</button><button class="btn-bad ${S.final.marks[i]===-1?'on-good':''}" data-act="fmark" data-i="${i}" data-s="-1">Wrong −${w}</button></div>`}).join('')}
      <div class="row"><div class="spacer"></div><button class="btn-gold" data-act="over">Show the winner</button></div></div>`:''}`;
  }else{
    const max=S.teams.length?Math.max(...S.teams.map(t=>t.score)):0;const win=S.teams.filter(t=>t.score===max);
    body=`<div class="cluebox"><div class="eyebrow" style="text-align:center">And the winner is</div><div class="banner">${win.length?win.map(t=>esc(t.name)).join(' & '):'Thanks for playing!'}</div><div style="text-align:center;font-family:var(--f-display);font-size:32px;color:var(--gold)">${max} points</div></div>
    <div class="scores">${[...S.teams].sort((a,b)=>b.score-a.score).map(t=>`<div class="team"><span class="nm">${esc(t.name)}</span><span class="sc">${t.score}</span></div>`).join('')}</div>
    <div class="row"><button class="btn-ghost" data-act="final-back">Back to final</button><div class="spacer"></div><button class="btn-gold" data-act="go-setup">Play again</button></div>`;
  }
  return `<div class="overlay" role="dialog" aria-label="Final round"><div class="ov-in">${body}</div></div>`;
}

/* ---------- player view ---------- */
function timerP(){return PS&&PS.tm&&(PS.tm.run||PS.tm.left<PS.tm.len)?`<div class="row"><div class="timer"><i id="tbar"></i></div><span class="ttext" id="ttext"></span>${!PS.tm.run?'<span class="muted">Paused</span>':''}</div>`:''}
function netNote(){return net==='nogame'?'<div class="note no">No game with that code is running yet. Check the code; this keeps trying.</div>':net==='nolib'?'<div class="note no">Couldn’t load the connection library. Check your internet connection and reload.</div>':''}
function playerLobbyHTML(st,mi){
  const my=st.teams[mi],n=my?(my.m||[]).length:0,total=st.teams.reduce((k,t)=>k+(t.m||[]).length,0)+(st.loose||[]).length;
  return `<div class="row"><div style="min-width:0"><div class="eyebrow">Lobby · game ${esc(P.code)}</div><h2>${esc(P.name)}${my?` <span class="muted" style="font-weight:400">· ${esc(my.name)}</span>`:''}</h2></div><div class="spacer"></div><div id="conn">${connHTML()}</div></div>
  <div class="card">${my?`<span class="big-status">You’re on ${esc(my.name)}</span><div class="status muted">${n===1?'It’s just you for now. Join another team below, or wait for others to join yours.':'Teammates: '+esc(my.m.map(m=>m.n).join(', '))}</div><div class="status muted">Waiting for the host to start the game…</div>`:'<span class="big-status">Pick a team</span>'}
    ${my&&st.create?`<div class="row"><input id="p-rename" maxlength="24" value="${esc(my.named?my.name:(pDraft.rename||''))}" data-pd="rename" placeholder="Rename your team (optional)" style="flex:1;min-width:0" aria-label="Team name"><button class="btn-sm" data-act="p-rename">Save name</button></div>`:''}
    ${my&&n>1&&st.create?'<div class="row" style="justify-content:center"><button class="btn-sm" data-act="p-solo">Leave and play solo</button></div>':''}
  </div>
  <div class="card"><div class="row"><h2>All teams</h2><div class="spacer"></div><span class="muted">${total} player${total===1?'':'s'} in the lobby</span></div>
    ${st.teams.length?`<div class="grid2">${st.teams.map((t,i)=>{const k=(t.m||[]).length,full=st.cap&&k>=st.cap&&i!==mi;return `<div class="spot ${i===mi?'mine':''}"><h3>${esc(t.name)}</h3>
      <span class="muted">${k}${st.cap?` / ${st.cap} spots`:''} player${k===1?'':'s'}</span>
      <span>${k?esc(t.m.map(m=>m.n).join(', ')):'<span class="muted">Empty</span>'}</span>
      ${i===mi?'<span class="badge">Your team</span>':`<button class="btn-sm" data-act="p-team" data-id="${esc(t.id)}" ${full?'disabled':''}>${full?'Full':'Join this team'}</button>`}</div>`}).join('')}</div>`:'<span class="note">No teams yet.</span>'}
    ${(st.loose||[]).length?`<span class="note">Not on a team: ${esc(st.loose.map(m=>m.n).join(', '))}</span>`:''}
    ${st.teams.length>1?'<div class="row"><button data-act="p-random">Put me on a random team</button></div>':''}
  </div>
  <div><button class="btn-ghost btn-sm" data-act="p-leave">Leave game</button></div>`;
}
function playerHTML(){
  if(P.step==='code')return `${header('Join a game')}${endedNote()}
    <div class="card" style="max-width:480px;width:100%;margin:0 auto">
      <label for="p-code">Game code</label><input id="p-code" class="codeinput" maxlength="4" value="${esc(P.code)}" data-p="code" autocomplete="off" autocapitalize="characters" placeholder="ABCD">
      <label for="p-name">Your name</label><input id="p-name" maxlength="20" value="${esc(P.name)}" data-p="name" autocomplete="nickname">
      <button class="btn-gold" data-act="p-join">Join</button>
      <span class="note">The 4-letter code is on the TV or the host’s screen. You’ll start on your own team, and you can join another team in the lobby.</span>
      <button class="btn-ghost btn-sm" data-act="go-role">Back</button></div>`;
  const st=PS;
  if(!st)return `${header('Game '+P.code)}<div class="card status">${net==='live'?'Joining…':'Connecting to the game…'}${netNote()}</div><button class="btn-ghost btn-sm" data-act="p-leave">Use a different code</button>`;
  const mi=myTeamIdx(st),myTeam=st.teams[mi];
  if(st.ph==='lobby')return playerLobbyHTML(st,mi);
  if(mi<0)return `${header('Pick your team')}
    ${st.teams.length?`<div class="grid2">${st.teams.map(t=>{const n=(t.m||[]).length,full=st.cap&&n>=st.cap;return `<button class="spot" data-act="p-team" data-id="${esc(t.id)}" ${full?'disabled':''}><h3>${esc(t.name)}</h3><span class="muted">${n}${st.cap?` / ${st.cap} spots`:''}${full?' · full':''}</span></button>`}).join('')}</div>
    <button class="btn-gold" data-act="p-random">Put me on any team (random)</button>`:'<div class="card status">No teams yet. Ask the host to add one.</div>'}
    <button class="btn-ghost btn-sm" data-act="p-leave">Leave game</button>`;

  else if(st.ph==='dd')main=`<div class="cluebox"><div class="eyebrow" style="text-align:center">${esc(st.clue?.cat)}</div><div class="dd">Daily Double!</div><div class="status">One team plays this clue and sets a wager.</div></div>`;
  else if(st.ph==='clue'&&st.clue){
    const c=st.clue,who=c.who,mine=who===mi,tried=(c.tried||[]).includes(mi),res=c.res||{};let act='';
    if(c.a)act=`<div class="answer revealed"><span class="eyebrow">Answer</span><span class="a">${esc(c.a)}</span></div>${res[mi]===1?'<div class="big-status" style="color:var(--good)">Your team got it!</div>':res[mi]===-1?'<div class="status no">Not this time.</div>':''}`;
    else if(mine)act=`<div class="big-status">Your team is answering!</div>`+(st.ans==='typed'?`<div class="card"><label for="p-ans">Your team’s answer</label><textarea id="p-ans" maxlength="80" data-pd="ans" ${pSent.ans===st.epoch?'disabled':''}>${esc(pDraft.ans)}</textarea><button class="btn-gold" data-act="p-ans" ${pSent.ans===st.epoch?'disabled':''}>${pSent.ans===st.epoch?'Sent ✓':'Send answer'}</button><span class="note">Anyone on your team can answer. The first answer sent counts.</span></div>`:`<div class="status">Anyone on your team can say the answer out loud.</div>`)+(res[mi]===-1?'<div class="status no">The host marked that wrong.</div>':'');
    else if(st.mode==='buzz'&&who==null){const buzzed=pSent.buzz===st.epoch;act=tried?`<div class="status muted">Your team already tried this one.</div>`:`<button class="buzz" data-act="p-buzz" ${!st.open||buzzed?'disabled':''}>${buzzed?'IN!':'BUZZ'}</button><div class="status muted">${buzzed?'Buzzed! Waiting…':st.open?'Tap BUZZ when your team knows it.':'Buzzers are closed.'}</div>`}
    else act=`<div class="status"><b>${esc(who!=null?st.teams[who]?.name:'Another team')}</b> is answering.${tried?' Your team already tried.':''}</div>`;
    main=`<div class="eyebrow">${esc(c.cat)} · ${c.dd?'Daily Double':c.val+' points'}</div>
    <div class="cluebox" style="min-height:130px">${c.m?'<div class="cliptag">♪ Listen to the clip on the TV</div>':''}<div class="clue" style="font-size:clamp(20px,5.5vw,34px)">${clueText(c.q||'')}</div>${c.h?`<div class="hint">Hint: ${esc(c.h)}</div>`:''}</div>
    ${!c.a?timerP():''}${act}`;
  }else if(st.fin){
    const f=st.fin;
    if(st.ph==='final-cat')main=`<div class="cluebox"><div class="eyebrow" style="text-align:center">Final round category</div><div class="dd" style="font-size:clamp(30px,10vw,60px)">${esc(f.cat)}</div></div>
      <div class="card"><label for="p-wager">Your team’s wager (0 to ${Math.max(0,myTeam.score)})</label><input id="p-wager" type="number" inputmode="numeric" min="0" max="${Math.max(0,myTeam.score)}" value="${esc(pDraft.wager)}" data-pd="wager">
      <button class="btn-gold" data-act="p-wager">${pSent.wager===st.epoch?'Update wager':'Send wager'}</button>${pSent.wager===st.epoch?'<span class="note">Sent to the host. Agree on one wager with your team.</span>':''}</div>`;
    else if(st.ph==='final-clue')main=`<span class="eyebrow">Final round · ${esc(f.cat)}</span><div class="cluebox" style="min-height:130px"><div class="clue" style="font-size:clamp(20px,5.5vw,34px)">${esc(f.q)}</div>${f.h?`<div class="hint">Hint: ${esc(f.h)}</div>`:''}</div>
      ${timerP()}<div class="card"><label for="p-fans">Your team’s answer</label><textarea id="p-fans" maxlength="80" data-pd="fans">${esc(pDraft.fans)}</textarea>
      <button class="btn-gold" data-act="p-fans">${pSent.fans===st.epoch?'Update answer':'Send answer'}</button>${pSent.fans===st.epoch?'<span class="note">Sent to the host.</span>':''}</div>`;
    else if(st.ph==='final-reveal')main=`<span class="eyebrow">Final round · ${esc(f.cat)}</span><div class="cluebox" style="min-height:120px"><div class="clue" style="font-size:clamp(20px,5.5vw,30px)">${esc(f.q)}</div></div><div class="answer revealed"><span class="eyebrow">Answer</span><span class="a">${esc(f.a)}</span></div>${f.res&&f.res[mi]===1?'<div class="big-status" style="color:var(--good)">Your team got it!</div>':f.res&&f.res[mi]===-1?'<div class="status no">Not this time.</div>':''}`;
    else{const max=st.teams.length?Math.max(...st.teams.map(t=>t.score)):0;const won=myTeam.score===max;main=`<div class="cluebox"><div class="eyebrow" style="text-align:center">Winner</div><div class="banner">${st.teams.filter(t=>t.score===max).map(t=>esc(t.name)).join(' & ')}</div>${won?'<div class="status">That’s your team. Well played!</div>':''}</div>`}
  }
  return `<div class="row"><div style="min-width:0"><div class="eyebrow">${esc(st.title)} · ${esc(P.code)}</div><h2>${esc(P.name)} <span class="muted" style="font-weight:400">· ${esc(myTeam.name)}</span></h2></div><div class="spacer"></div><div id="conn">${connHTML()}</div></div>
  ${main}
  <div class="scores">${st.teams.map((t,i)=>`<div class="team ${st.hi===i?'turn':''}">${st.hi===i?`<span class="badge">${st.ph==='clue'&&st.clue&&st.clue.who===i?'Answering':'Picking'}</span>`:''}<span class="nm">${esc(t.name)}${i===mi?' <span class="muted">(you)</span>':''}</span><span class="sc ${t.score<0?'neg':''}">${t.score}</span><span class="mem">${esc((t.m||[]).map(m=>m.n).join(', '))}</span></div>`).join('')}</div>
  <div><button class="btn-ghost btn-sm" data-act="p-leave">Leave game</button></div>`;
}

      ${st.teams.length?`<div class="grid2">${st.teams.map(t=>`<div class="spot"><h3>${esc(t.name)}</h3><span class="muted">${(t.m||[]).length}${st.cap?` / ${st.cap}`:''} players</span><span style="font-size:18px">${(t.m||[]).length?esc(t.m.map(m=>m.n).join(', ')):'<span class="muted">Waiting for players…</span>'}</span></div>`).join('')}</div>`:'<div class="status muted" style="font-size:20px">Teams will appear here as they’re created.</div>'}
      ${(st.loose||[]).length?`<div class="status muted">Still choosing: ${esc(st.loose.map(m=>m.n).join(', '))}</div>`:''}`;
  if(st.ph==='board')main=`<div class="turnbar"><span class="eyebrow">${st.mode==='turns'?'Picking now':'Picks next'}</span><b>${esc(st.teams[st.turn]?.name)}</b></div>${boardHTML(st.cats,st.used,false)}`;
  else if(st.ph==='dd')main=`<div class="tvbox"><div class="eyebrow" style="text-align:center">${esc(st.clue?.cat)}</div><div class="dd">Daily Double!</div></div>`;

    const c=st.clue,who=c.who,res=c.res||{},r=who!=null?res[who]:null;

    <div class="tvbox">${c.m?`<div class="cliptag" style="font-size:18px">♪ Listen${c.m.spotify?' · playing from Spotify':''}</div>`:''}<div class="tvclue">${clueText(c.q||'')}</div>${c.h?`<div class="hint" style="font-size:clamp(18px,2.6vw,30px)">Hint: ${esc(c.h)}</div>`:''}</div>

    ${r===1?`<div class="result ok">Correct! ${esc(st.teams[who]?.name)} +${c.val}</div>`:r===-1&&!c.a?'<div class="result no">Not quite</div>':''}
    ${c.a||(c.rev&&c.m&&c.m.spotify)?`<div class="answer revealed"><span class="eyebrow">Answer</span><span class="a" style="font-size:clamp(22px,3.4vw,44px)">${esc(c.a||'')}</span></div>${c.m&&c.m.spotify?songCard(c.m.spotify,152):''}`:''}
    ${st.mode==='buzz'&&who==null&&!c.a?`<div class="status" style="font-size:22px">${st.open?'Buzzers are open!':'Buzzers closed'}</div>`:''}
    ${(c.queue||[]).length&&!c.a?`<div class="row" style="justify-content:center">${c.queue.map((n,i)=>`<span class="pill" style="font-size:16px">${i+1}. ${esc(n)}</span>`).join('')}</div>`:''}

    else if(st.ph==='final-reveal')main=`<span class="eyebrow" style="font-size:15px">Final round · ${esc(f.cat)}</span><div class="tvbox" style="min-height:30vh"><div class="tvclue" style="font-size:clamp(24px,3.4vw,44px)">${esc(f.q)}</div></div>

      ${f.res?`<div class="row" style="justify-content:center">${Object.keys(f.res).map(i=>`<span class="pill" style="font-size:16px">${esc(st.teams[i]?.name)} <span class="${f.res[i]===1?'ok':'no'}">${f.res[i]===1?'✓ correct':'✗ wrong'}</span></span>`).join('')}</div>`:''}`;
    else{const max=st.teams.length?Math.max(...st.teams.map(t=>t.score)):0;main=`<div class="tvbox"><div class="eyebrow" style="text-align:center">And the winner is</div><div class="banner">${st.teams.filter(t=>t.score===max).map(t=>esc(t.name)).join(' & ')}</div><div style="text-align:center;font-family:var(--f-display);font-size:40px;color:var(--gold)">${max} points</div></div>`}
  }
  return `${bar}${main}${scores}
  <details class="card"><summary class="eyebrow" style="cursor:pointer">Music on this screen</summary><span class="note">The host turns background music on and off. ${PS&&PS.music?'Music is on.':'Music is off right now.'} Sound effects play only for correct and wrong answers.</span>${musicControlsHTML()}</details>`;
}

/* ---------- events ---------- */
function goHost(){setTimeout(fillSongTitles,500);view='host';if(!peer||netCode!==S.code||!conns)hostOpen(false);keepAwake();render();broadcast()}
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b||b.disabled)return;
  const a=b.dataset.act,i=+b.dataset.i;
  if(view==='host'||view==='display'||a==='go-display'||a==='go-host'||a==='d-code'||a==='resume'||a==='create')audio();
  switch(a){
    case 'go-role':if(view!=='host')netClose();if(view==='display')Music.stop();view='role';render();break;
    case 'go-host':if(S)goHost();else{view='setup';render()}break;
    case 'go-setup':view='setup';confirmNew=false;render();window.scrollTo(0,0);break;
    case 'go-player':view='player';render();break;
    case 'go-display':view='display';if(D.step==='live'&&D.code){PS=null;PSkey='';clientOpen(D.code,'display');keepAwake()}render();break;
    case 'src':setup.source=b.dataset.v;if(setup.source==='custom'&&!setup.customId&&custom[0])setup.customId=custom[0].id;saveSetup();render();break;
    case 'preset':setup.preset=b.dataset.v;saveSetup();render();break;
    case 'pickcat':{const v=b.dataset.v,k=setup.pick.indexOf(v);if(k>=0)setup.pick.splice(k,1);else if(setup.pick.length<5)setup.pick.push(v);saveSetup();render();break}
    case 'pickcustom':setup.customId=b.dataset.v;saveSetup();render();break;
    case 'set':setup.settings[b.dataset.k]=JSON.parse(b.dataset.v);saveSetup();render();break;
    case 'resume':goHost();break;
    case 'create':if(S&&S.phase!=='over'&&S.phase!=='lobby'){confirmNew=true;render();break}
    /* falls through */
    case 'new-yes':{confirmNew=false;const go=()=>{const fresh=createGame();if(!S)return;view='host';if(fresh||netCode!==S.code||!peer)hostOpen(true);keepAwake();commit();fillSongTitles();window.scrollTo(0,0)};
      if(S&&S.phase!=='lobby'&&conns.size){sendEnded();setTimeout(go,600)}else go();break}
    case 'end-game':confirmEnd=true;render();break;
    case 'end-no':confirmEnd=false;render();break;
    case 'end-yes':endGame();break;
    case 'new-no':confirmNew=false;render();break;
    case 'begin':S.phase='board';S.turn=S.teams.length?Math.floor(Math.random()*S.teams.length):0;commit();break;
    case 'show-lobby':showLobby=true;render();break;
    case 'hide-lobby':showLobby=false;render();break;
    case 'copy':{const inp=$('#joinlink');try{navigator.clipboard.writeText(joinLink(S.code)).then(()=>{b.textContent='Copied'},()=>{inp.select()})}catch{inp&&inp.select()}break}
    case 'add-team':{const inp=$('#newteam');const t=addTeam(inp?inp.value:'');if(!t){inp&&inp.focus();return}if(inp)inp.value='';commit();break}
    case 'rm-team':{const id=b.dataset.id;if(S.phase!=='lobby'&&S.teams.find(t=>t.id===id)?.score){if(confirmRm!==id){confirmRm=id;b.textContent='Tap again to delete';return}}
      confirmRm=null;const k=teamIdx(id);if(k<0)return;Object.values(S.members).forEach(m=>{if(m.team===id)m.team=null});S.teams.splice(k,1);if(S.turn>=S.teams.length)S.turn=0;commit();break}
    case 'mix':mixTeams(+b.dataset.n);commit();break;
    case 'setturn':S.turn=i;commit();break;
    case 'ed-new':edit={id:'c'+Date.now(),title:'Jeopardy Showdown',cats:[0,1,2,3,4].map(n=>({name:'Category '+(n+1),clues:VALUES.map(()=>({q:'',a:'',h:'',alt:''}))})),final:{cat:'',q:'',a:'',h:'',alt:''}};editFrom='setup';confirmDel=false;view='editor';render();window.scrollTo(0,0);break;
    case 'ed-custom':{const c=custom.find(x=>x.id===setup.customId);if(!c)return;edit=clone(c);editFrom='setup';confirmDel=false;view='editor';render();window.scrollTo(0,0);break}
    case 'ed-host':edit=clone(S.game);if(!edit.id||!custom.some(x=>x.id===edit.id))edit.id='c'+Date.now();editFrom='host';confirmDel=false;view='editor';render();window.scrollTo(0,0);break;
    case 'ed-cancel':view=editFrom==='host'?'host':'setup';render();break;
    case 'ed-apply':S.game=clone(edit);view='host';commit();break;
    case 'ed-save':{const k=custom.findIndex(x=>x.id===edit.id);const g=clone(edit);g.cats.forEach(c=>delete c.bank);if(k>=0)custom[k]=g;else custom.push(g);store.set('ssw.custom',custom);
      if(editFrom==='host'){S.game=clone(edit);view='host';commit()}else{setup.source='custom';setup.customId=edit.id;saveSetup();view='setup';render()}break}
    case 'ed-del':confirmDel=true;render();break;
    case 'del-no':confirmDel=false;render();break;
    case 'del-yes':custom=custom.filter(x=>x.id!==edit.id);store.set('ssw.custom',custom);setup.customId=custom[0]?.id||null;saveSetup();view='setup';render();break;
    case 'tile':openTile(+b.dataset.c,+b.dataset.r);break;
    case 'close':closeTile();break;
    case 'close-nouse':S.cur=null;S.phase='board';commit();break;
    case 'adj':S.teams[i].score+=+b.dataset.v;commit();break;
    case 'tv':S.tv=!S.tv;peek=false;commit();break;
    case 'sound':S.sound=S.sound===false;commit();break;
    case 'music':S.music=!S.music;commit();break;
    case 'tmusic':S.tmusic=S.tmusic===false;commit();break;
    case 'clip-play':clipCmd('play');commit();break;
    case 'clip-stop':clipCmd('stop');commit();break;
    case 'music-builtin':Music.file(null);render();break;
    case 'd-sound':D.mute=!D.mute;saveDisplay();displayAudio();render();break;
    case 'peek':peek=!peek;render();break;
    case 'hint':S.hint=true;commit();break;
    case 'reveal':S.revealed=true;S.buzzOpen=false;S.tmr.left=tLeft();S.tmr.run=false;commit();break;
    case 't-start':resetTimer(true);commit();break;
    case 't-pause':S.tmr.left=tLeft();S.tmr.run=false;commit();break;
    case 't-resume':S.tmr.end=Date.now()+S.tmr.left;S.tmr.run=true;S.timeUp=false;commit();break;
    case 't-reset':resetTimer(false);commit();break;
    case 'swap':{if(curClue()?.m)clipCmd('stop');const c=S.cur,cat=S.game.cats[c.c],d=(S.game.levels||LEVELS.all)[c.r],curQ=curClue().q;let pool=[];const onBoard=new Set(cat.clues.map(x=>x.q));
      const b0=cat.bank&&BANK.find(x=>x.id===cat.bank);if(b0)for(let dist=0;dist<2&&!pool.length;dist++)pool=b0.q.filter(q=>Math.abs(q[0]-d)===dist&&!onBoard.has(q[1])).map(q=>({x:q,from:null}));
      if(!pool.length)BANK.forEach(bk=>bk.q.forEach(q=>{if(q[0]===d&&q[1]!==curQ)pool.push({x:q,from:bk.name})}));
      const pk=rnd(pool);const nc=mkClue(pk.x);if(pk.from&&pk.from!==cat.name)nc.from=pk.from;cat.clues[c.r]=nc;S.hint=false;newEpoch();S.scored={};resetTimer(S.settings.autoTimer);if(nc.m)clipCmd('play');commit();break}
    case 'buzz-open':S.buzzOpen=true;commit();break;
    case 'buzz-close':S.buzzOpen=false;commit();break;
    case 'buzz-reset':newEpoch();S.buzzOpen=true;commit();break;
    case 'set-ans':S.answering=i;S.buzzOpen=false;resetTimer(S.settings.autoTimer);commit();break;
    case 'mark':markClue(i,+b.dataset.s);commit();break;
    case 'next-team':nextTeam();commit();break;
    case 'pass':{if(S.passes>0)return;passTo(i<0?null:i);commit();break}
    case 'dd-team':S.ddTeam=i;commit();break;
    case 'dd-go':{const t=S.ddTeam,max=Math.max(500,S.teams[t].score);let w=parseInt(S.ddWager,10);if(!(w>=5))w=Math.min(500,max);S.ddWager=String(Math.min(w,max));S.answering=t;S.phase='clue';resetTimer(S.settings.autoTimer);if(curClue().m)clipCmd('play');commit();break}
    case 'final':S.phase='final-cat';newEpoch();S.hint=false;S.final={wagers:{},marks:{}};S.tmr.run=false;peek=false;commit();break;
    case 'final-cancel':S.phase='board';commit();break;
    case 'use-wagers':inboxList('wag').forEach(x=>{S.final.wagers[x.team]=x.v});saveHost();render();break;
    case 'final-clue':{S.teams.forEach((t,k)=>{const w=parseInt(S.final.wagers[k],10)||0;S.final.wagers[k]=Math.max(0,Math.min(w,Math.max(0,t.score)))});S.phase='final-clue';peek=false;S.hint=false;const keepW=S.inbox.wag;newEpoch();S.inbox.wag=keepW;resetTimer(S.settings.autoTimer);commit();break}
    case 'final-reveal':{S.phase='final-reveal';S.tmr.run=false;
      if(S.settings.answers==='typed'&&S.settings.auto){const done={};inboxList('fans').forEach(x=>{if(done[x.team])return;done[x.team]=1;scoreTeam(x.team,judge(x.t,S.game.final)?1:-1,parseInt(S.final.wagers[x.team],10)||0,S.final.marks)});const v=Object.values(S.final.marks);if(v.length)fire(v.includes(1)?'ok':'no')}
      commit();break}
    case 'fmark':scoreTeam(i,+b.dataset.s,parseInt(S.final.wagers[i],10)||0,S.final.marks);if(S.final.marks[i]===+b.dataset.s)fire(+b.dataset.s===1?'ok':'no');commit();break;
    case 'over':S.phase='over';commit();break;
    case 'final-back':S.phase='final-reveal';commit();break;
    /* player */
    case 'p-join':{const c=String(P.code||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==4){$('#p-code')?.focus();return}if(!short(P.name,20)){$('#p-name')?.focus();return}
      P.code=c;P.name=short(P.name,20);P.step='in';ended=false;savePlayer();PS=null;PSkey='';clientOpen(c,'player');render();break}
    case 'p-leave':send({t:'leave'});P.step='code';savePlayer();netClose();PS=null;PSkey='';render();break;
    case 'p-pick':if(!PS||PS.ph!=='board')return;send({t:'pick',c:+b.dataset.c,r:+b.dataset.r});break;
    case 'p-team':send({t:'join',id:b.dataset.id});break;
    case 'p-random':send({t:'random'});break;
    case 'p-create':{send({t:'create',name:short(pDraft.team,24)});pDraft.team='';break}
    case 'p-solo':send({t:'solo'});break;
    case 'p-rename':send({t:'rename',name:short(pDraft.rename,24)});break;
    case 'p-buzz':if(!PS)return;pSent.buzz=PS.epoch;send({t:'buzz',e:PS.epoch});try{navigator.vibrate&&navigator.vibrate(60)}catch{}render();break;
    case 'p-ans':if(!PS||!short(pDraft.ans,80))return;pSent.ans=PS.epoch;send({t:'ans',e:PS.epoch,text:pDraft.ans});render();break;
    case 'p-wager':if(!PS)return;pSent.wager=PS.epoch;send({t:'wager',e:PS.epoch,v:pDraft.wager});render();break;
    case 'p-fans':if(!PS||!short(pDraft.fans,80))return;pSent.fans=PS.epoch;send({t:'fans',e:PS.epoch,text:pDraft.fans});render();break;
    /* display */
    case 'd-code':{ended=false;const c=String(D.code||'').toUpperCase().replace(/[^A-Z]/g,'');if(c.length!==4){$('#d-code')?.focus();return}D.code=c;D.step='live';saveDisplay();PS=null;PSkey='';clientOpen(c,'display');keepAwake();render();break}
    case 'd-leave':D.step='code';saveDisplay();netClose();Music.stop();Clip.stop();lastFx=null;lastClip=null;PS=null;PSkey='';view='role';render();break;
    case 'd-full':try{const r=document.documentElement.requestFullscreen?.();r&&r.catch&&r.catch(()=>{})}catch{}break;
  }
});
document.addEventListener('input',e=>{
  const t=e.target,d=t.dataset;
  if(d.bind==='ddWager'){S.ddWager=t.value;saveHost()}
  else if(d.fw!==undefined){S.final.wagers[+d.fw]=t.value;saveHost()}
  else if(d.p){P[d.p]=d.p==='code'?t.value.toUpperCase():t.value;if(d.p==='code')t.value=P.code}
  else if(d.pd){pDraft[d.pd]=t.value}
  else if(d.d){D.code=t.value.toUpperCase();t.value=D.code}
  else if(d.music==='vol'){Music.vol(+t.value)}
  else if(d.ed){const c=+d.c,r=+d.r,v=t.value;
    if(d.ed==='title')edit.title=v;else if(d.ed==='cat')edit.cats[c].name=v;
    else if(['q','a','h','alt'].includes(d.ed))edit.cats[c].clues[r][d.ed]=v;
    else if(d.ed==='fcat')edit.final.cat=v;else if(d.ed==='fq')edit.final.q=v;else if(d.ed==='fa')edit.final.a=v;else if(d.ed==='fh')edit.final.h=v;else if(d.ed==='falt')edit.final.alt=v}
});
document.addEventListener('change',e=>{
  const d=e.target.dataset;
  if(d.music==='file'){const f=e.target.files&&e.target.files[0];if(f){Music.file(f);render()}return}
  if(d.opt){setup.settings[d.opt]=e.target.checked;saveSetup();render()}
  if(d.rename!==undefined&&S){if(!renameTeam(d.rename,e.target.value)){e.target.value='';e.target.placeholder='That name is taken'}commit();return}
  if(d.mv!==undefined&&S){const pid=d.mv,v=e.target.value;if(!S.members[pid])return;
    if(v==='x'){delete S.members[pid];conns.forEach((inf,c)=>{if(inf.pid===pid){try{c.close()}catch{}}})}
    else if(v==='-')S.members[pid].team=null;else if(v&&teamIdx(v)>=0)S.members[pid].team=v;
    commit()}
});
document.addEventListener('keydown',e=>{
  const id=e.target.id;if(e.key!=='Enter')return;
  const map={'p-code':'p-join','p-name':'p-join','d-code':'d-code','newteam':'add-team','p-newteam':'p-create'};
  if(map[id]){e.preventDefault();$(`[data-act="${map[id]}"]`)?.click()}
});
/* resume as a player or board after a reload */
if(view==='role'&&D.step==='live'&&D.code&&!S){/* wait for a tap; avoid auto-joining */}
/* a scanned QR code or shared link always opens that game, even if this phone was in another game before */
function handleHash(){
  const h=(location.hash||'').replace('#','').toUpperCase();if(!/^[A-Z]{4}$/.test(h))return false;
  if(view==='host'||view==='display'||view==='setup'||view==='editor')return false;
  if(view==='player'&&P.step!=='code'&&P.code===h&&net!=='off')return true;
  netClose();PS=null;PSkey='';ended=false;P.code=h;view='player';
  if(short(P.name,20)){P.step='in';savePlayer();clientOpen(h,'player')}else{P.step='code';savePlayer()}
  render();return true;
}
window.addEventListener('hashchange',handleHash);
window.addEventListener('pageshow',e=>{if(e.persisted)handleHash()});
if(!handleHash()&&view==='player'&&P.step!=='code'&&P.code){clientOpen(P.code,'player')}
render();
</script>
